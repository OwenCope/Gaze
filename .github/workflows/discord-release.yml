# Posts every published Gaze release to Discord.
#
# Needs repository secret DISCORD_RELEASE_WEBHOOK (the Discord webhook URL).
# Create it with:
#   Discord channel > Edit Channel > Integrations > Webhooks > New Webhook > Copy URL
#   GitHub repo > Settings > Secrets and variables > Actions > New repository secret
#     Name: DISCORD_RELEASE_WEBHOOK, Value: <pasted webhook URL>
# If the secret is empty the workflow prints a notice and exits 0.

name: discord-release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to re-post (e.g. v1.2.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Post release to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORD_RELEASE_WEBHOOK is not set; skipping Discord announcement."
            exit 0
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json tagName,name,body,url,isDraft,isPrerelease,publishedAt > /tmp/release.json
          else
            jq '{tagName: .release.tag_name, name: .release.name, body: (.release.body // ""), url: .release.html_url, isDraft: .release.draft, isPrerelease: .release.prerelease, publishedAt: .release.published_at}' \
              "$GITHUB_EVENT_PATH" > /tmp/release.json
          fi

          if [ "$(jq -r '.isDraft // false' /tmp/release.json)" = "true" ]; then
            echo "Skipping: release is a draft."
            exit 0
          fi
          if [ "$(jq -r '.isPrerelease // false' /tmp/release.json)" = "true" ]; then
            echo "Skipping: release is a prerelease."
            exit 0
          fi

          python3 - <<'PY'
          import json
          import re

          with open("/tmp/release.json") as f:
              rel = json.load(f)

          tag = rel.get("tagName") or ""
          name = rel.get("name") or tag
          url = rel.get("url") or ""
          body = rel.get("body") or ""
          published = rel.get("publishedAt") or None

          # The one-line summary from the centred header, and the first release
          # picture that is not the icon or the download button.
          summary = ""
          m = re.search(r"<h1>.*?</h1>\s*<p>(.*?)</p>", body, re.S)
          if m and "<img" not in m.group(1):
              summary = re.sub(r"<[^>]+>", "", m.group(1)).strip()
          picture = None
          for src in re.findall(r'<img[^>]+src="([^"]+)"', body) + re.findall(r"!\[[^\]]*\]\(([^)\s]+)\)", body):
              if not src.endswith(("/icon.png", "download-button.png")):
                  picture = src
                  break

          # The notes: from the first Markdown heading, without HTML, without the
          # Install section (Discord is not where you install it).
          lines = body.splitlines()
          start = next((k for k, line in enumerate(lines) if re.match(r"^#{1,6}\s+\S", line)), 0)
          body = "\n".join(lines[start:])
          body = re.sub(r"<[^>]+>", "", body)
          body = re.sub(r"!\[[^\]]*\]\([^)]*\)", "", body)
          kept = []
          for line in body.splitlines():
              if re.match(r"^##\s+Install\b", line, re.IGNORECASE):
                  break
              kept.append(line)
          body = "\n".join(kept)
          body = re.sub(r"\n[ \t]*\n[ \t]*\n(?:[ \t]*\n)+", "\n\n", body).strip()

          version = tag[1:] if tag.startswith("v") else tag
          # The notes' own "What's new" heading repeats what a release post is, so the
          # section headings stand on their own.
          body = re.sub(r"^##\s+What.s new\s*\n+", "", body, flags=re.IGNORECASE | re.MULTILINE).strip()
          head = f"# Gaze {version}" + (f"\n{summary}" if summary else "")
          download = "https://gazeunlock.com/download"
          sender = {
              "username": "Gaze",
              "avatar_url": "https://raw.githubusercontent.com/OwenCope/Gaze/main/docs/images/icon.png",
              "allowed_mentions": {"parse": []},
          }

          # Laid out like the release page: title and summary, the picture edge to
          # edge, the notes, then real buttons. Discord caps a message's text at 4,000.
          notes = body
          if len(notes) > 3600:
              cut = notes[:3600]
              notes = cut[: cut.rfind("\n")].rstrip() + "\n…and more in the full notes."
          components = [{"type": 10, "content": head}]
          if picture:
              components.append({"type": 12, "items": [{"media": {"url": picture}}]})
          if notes:
              components.append({"type": 10, "content": notes})
          components.append({"type": 1, "components": [
              {"type": 2, "style": 5, "label": "Download for Mac", "url": download},
              {"type": 2, "style": 5, "label": "Release Notes", "url": url},
          ]})
          with open("/tmp/discord.json", "w") as f:
              json.dump({**sender, "flags": 1 << 15, "components": components}, f)

          # The plain message, if Discord ever refuses the layout above.
          links = f"**[Download]({download})**  ·  [Release notes](<{url}>)"
          room = 2000 - len(head) - len(links) - 40
          plain = body
          if len(plain) > room:
              cut = plain[:room]
              plain = cut[: cut.rfind("\n")].rstrip() + "\n…and more in the full notes."
          fallback = {**sender, "content": head + "\n\n" + plain + "\n\n" + links}
          if picture:
              fallback["embeds"] = [{"image": {"url": picture}}]
          with open("/tmp/discord-plain.json", "w") as f:
              json.dump(fallback, f)
          PY

          # Components on a webhook message need with_components=true.
          case "$DISCORD_WEBHOOK" in *\?*) SEP='&' ;; *) SEP='?' ;; esac
          if ! curl -fsS -H 'Content-Type: application/json' \
            -d @/tmp/discord.json "${DISCORD_WEBHOOK}${SEP}with_components=true"; then
            echo "Discord refused the component layout; posting the plain message."
            curl -fsS -H 'Content-Type: application/json' \
              -d @/tmp/discord-plain.json "$DISCORD_WEBHOOK"
          fi
